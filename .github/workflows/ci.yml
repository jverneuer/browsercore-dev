on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-publish:
    # Remote self-call, same as every sibling repo. The local "./" self-call
    # startup-failed on every run since 2026-08-08 across all file revisions
    # (see run history) — the remote ref is the proven-working invocation.
    uses: jverneuer/browsercore-dev/.github/workflows/reusable-ci.yml@main
    with:
      node-version: '26'
    permissions:
      contents: write
      id-token: write
    secrets: inherit
