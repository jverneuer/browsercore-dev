name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - run: npm install

      - name: Enforce no console.log in src/
        run: |
          VIOLATIONS=$(grep -rnE 'console\.(log|warn|error)\(' src/ \
            | grep -v '^\s*//' \
            | grep -v '^\s*\*' \
            | grep -v '^\s*/\*' \
            | grep -v 'eslint-disable' \
            | grep -v 'oxlint-disable' \
            || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "ERROR: console.log/warn/error found in src/. Use injected Logger instead."
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "No console.log in src/: OK"

      - run: npm run typecheck
      - run: npm run lint -- --deny-warnings
      - run: npm test -- --coverage

      - name: Enforce >=94% coverage (statements, branches, functions, lines)
        env:
          MINIMUM: "94"
        run: |
          node -e "
          const t = require('./coverage/coverage-summary.json').total;
          const s = t.statements.pct, b = t.branches.pct, f = t.functions.pct, l = t.lines.pct;
          const min = parseFloat(process.env.MINIMUM);
          const failed = [['statements',s],['branches',b],['functions',f],['lines',l]].filter(([,p])=>p<min);
          if (failed.length) {
            console.error('Coverage below '+min+'% threshold:');
            for (const [k,p] of failed) console.error('  '+k+' '+p+'% < '+min+'%');
            process.exit(1);
          }
          console.log('Coverage OK');
          "

      - run: npm run build

      - name: Commit coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add -f .github/coverage-badge.json COVERAGE.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "ci: update coverage badge [skip ci]"
            git push origin HEAD:main
          fi
