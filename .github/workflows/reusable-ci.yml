name: CI (reusable)

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node version to use"
        default: "26"
        required: false
        type: string
      deploy-pages:
        description: "Deploy coverage badge to GitHub Pages"
        default: false
        required: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.current }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - run: npm install

      - run: npm run typecheck
      - run: npm run lint -- --deny-warnings
      - run: npm test -- --coverage

      - name: Enforce >=94% coverage (statements, branches, functions, lines)
        env:
          MINIMUM: "93"
        run: |
          node -e "
          const t = require('./coverage/coverage-summary.json').total;
          const s = t.statements.pct, b = t.branches.pct, f = t.functions.pct, l = t.lines.pct;
          const min = parseFloat(process.env.MINIMUM);
          const failed = [['statements',s],['branches',b],['functions',f],['lines',l]].filter(([,p])=>p<min);
          if (failed.length) {
            console.error('Coverage below '+min+'% threshold:');
            for (const [k,p] of failed) console.error('  '+k+' '+p+'% < '+min+'%');
            process.exit(1);
          }
          console.log('Coverage OK — statements '+s+'%, branches '+b+'%, functions '+f+'%, lines '+l+'% >= '+min+'%');
          "

      - name: Generate COVERAGE.md + badge
        run: |
          npx coverage-md 2>/dev/null || true
          node -e "
          const fs = require('fs');
          const t = JSON.parse(fs.readFileSync('coverage/coverage-summary.json','utf8')).total;
          const pct = t.statements.pct;
          const color = pct >= 90 ? 'brightgreen' : pct >= 75 ? 'green' : pct >= 50 ? 'yellow' : 'red';
          const badge = { schemaVersion: 1, label: 'coverage', message: pct+'%', color, namedLogo: 'vitest' };
          fs.mkdirSync('.github', { recursive: true });
          fs.writeFileSync('.github/coverage-badge.json', JSON.stringify(badge));
          "

      - run: npm run build

      - name: Record version
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            COVERAGE.md
            .github/coverage-badge.json

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: CI
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://registry.npmjs.org

      - run: npm install

      - name: Publish to npm (skips if version already exists)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on npm — skipping publish"
            exit 0
          fi
          npm publish --access public --provenance

      - name: Create git tag and GitHub Release with changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists — skipping release"
            exit 0
          fi

          # Find the previous tag for the changelog range
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")

          # Collect commits and group by conventional-commit prefix
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi

          # Build categorized changelog from commit messages
          CHANGELOG=$(node -e '
            const { execSync } = require("child_process");
            const prevTag = process.argv[1];
            const range = prevTag ? `${prevTag}..HEAD` : "HEAD";
            const log = execSync(`git log ${range} --pretty=format:"%s" --no-merges`, { encoding: "utf8" });
            const lines = log.trim().split("\n").filter(Boolean);

            const categories = [
              { prefix: "feat",     label: "✨ Features" },
              { prefix: "fix",      label: "🐛 Bug Fixes" },
              { prefix: "refactor", label: "♻️ Refactoring" },
              { prefix: "perf",     label: "⚡ Performance" },
              { prefix: "docs",     label: "📚 Documentation" },
              { prefix: "test",     label: "🧪 Tests" },
              { prefix: "ci",       label: "🔧 CI" },
              { prefix: "chore",    label: "🔧 Chore" },
            ];

            const buckets = new Map();
            const uncategorized = [];

            for (const line of lines) {
              const match = line.match(/^(feat|fix|refactor|perf|docs|test|ci|chore)(?:\(([^)]+)\))?:\s*(.+)/);
              if (match) {
                const [, type, scope, desc] = match;
                const cat = categories.find(c => c.prefix === type);
                const key = cat.label;
                if (!buckets.has(key)) buckets.set(key, []);
                const formatted = scope ? `**${scope}**: ${desc}` : desc;
                buckets.get(key).push(`- ${formatted}`);
              } else {
                uncategorized.push(`- ${line}`);
              }
            }

            let output = "";
            for (const cat of categories) {
              const items = buckets.get(cat.label);
              if (items && items.length > 0) {
                output += `### ${cat.label}\n\n${items.join("\n")}\n\n`;
              }
            }
            if (uncategorized.length > 0) {
              output += `### Other Changes\n\n${uncategorized.join("\n")}\n\n`;
            }
            process.stdout.write(output.trim() || "Release published.");
          ' "$PREV_TAG")

          # Build release title from version + first feat/fix commit
          TITLE_DESC=$(git log $RANGE --pretty=format:"%s" --no-merges --grep="^feat" --grep="^fix" | head -1 | sed 's/^[^:]*://' | sed 's/^[[:space:]]*//')
          if [ -n "$TITLE_DESC" ]; then
            TITLE="${TAG} — ${TITLE_DESC}"
          else
            TITLE="${TAG}"
          fi

          # Create tag and release
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "$(echo -e "**${NAME}@${VERSION}**\n\n${CHANGELOG}")"

  deploy-pages:
    if: inputs.deploy-pages && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: _site/
      - run: mv _site/.github/coverage-badge.json _site/badge.json && rm -rf _site/.github
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site/
      - id: deployment
        uses: actions/deploy-pages@v5
